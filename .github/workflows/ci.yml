name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test dependencies
        run: |
          python -m pip install pytest numpy soundfile
          python -m pip install -r native_voice/requirements.txt
          python -m pip install -r social_layer/requirements-memory-service.txt
          python -m pip install -r voice_runtime/requirements.txt

      - name: Run V3/V4/V5 memory tests
        run: |
          PYTHONPATH=social_layer/src python -m pytest -q \
            social_layer/tests/test_memory.py \
            social_layer/tests/test_auto_memory.py \
            social_layer/tests/test_conversation_state.py \
            social_layer/tests/test_memory_recall_gate.py \
            social_layer/tests/test_memory_service.py \
            social_layer/tests/test_memory_benchmark.py \
            social_layer/tests/test_memory_shadow_audit.py \
            social_layer/tests/test_memory_gate_analysis.py \
            social_layer/tests/test_memory_gate_experiment.py \
            social_layer/tests/test_memory_gate_experiment_report.py

      - name: Run P10 Mouth and VoiceSession tests
        run: |
          PYTHONPATH=social_layer/src python -m pytest -q \
            voice_runtime \
            voice_orchestrator \
            capabilities/mouth \
            capabilities/voice_session

      - name: Run P11 Native Voice tests
        run: |
          PYTHONPATH=social_layer/src python -m pytest -q native_voice/tests

      - name: Run adapter, sticker, V3, V4, and P10 tests
        run: |
          bash scripts/test-openclaw-adapter
          bash scripts/test-sticker-explicit-fallback
          bash scripts/test-sticker-auto-delivery
          bash scripts/test-sticker-v21
          bash scripts/test-v3
          bash scripts/test-v3-runtime
          bash scripts/test-v3-sticker-bubble-order
          bash scripts/test-v4-state
          bash scripts/test-v4-runtime
          python -m pytest -q voice_runtime/tests
          python -m pytest -q voice_orchestrator/tests
          python -m pytest -q voice/singing/tests voice/tts/tests
