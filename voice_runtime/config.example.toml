[server]
host = "127.0.0.1"
port = 8770

[engine]
type = "yogurt_tts"
base_url = "http://127.0.0.1:17861"
timeout_seconds = 180

[voice]
default_profile = "yogurt"

# References and their transcripts are deliberately not configured here.
# The local 17861 Yogurt TTS service owns its private emotion registry.

[limits]
max_text_chars = 500
max_request_seconds = 180
max_concurrent_requests = 1
